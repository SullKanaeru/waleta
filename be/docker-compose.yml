version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: waleta_db
    restart: always
    environment:
      POSTGRES_USER: waleta_user
      POSTGRES_PASSWORD: waleta_password
      POSTGRES_DB: waleta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: waleta_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: waleta_user
      DB_PASSWORD: waleta_password
      DB_NAME: waleta_db
      DB_SSLMODE: disable
    depends_on:
      - db

volumes:
  postgres_data:
